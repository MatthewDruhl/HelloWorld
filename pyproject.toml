[project]
name = "helloworld"
version = "0.1.0"
description = "Throwaway target repo for exercising the pipeline-deck flow end to end."
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hello"]

[tool.pytest.ini_options]
testpaths = ["tests"]
